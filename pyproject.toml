[project]
name = "botbooking-demo"
version = "0.1.0"
description = "Telegram booking bot demo for service businesses"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.4,<4.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "tzdata>=2025.1",
]

[project.scripts]
botbooking = "botbooking.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["botbooking"]
